name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # The console half is pure standard library, so it is worth checking against
  # several Python versions. GUI tests skip themselves here: PyGObject comes from
  # the distribution and setup-python cannot see it.
  console:
    name: console - Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pytest
        run: python -m pip install --upgrade pip pytest
      - name: Show what this runner supports
        run: python fg_platform.py || true
      - name: Run the suite
        run: python -m pytest tests -q

  # The dashboard needs the distribution's PyGObject and a display, so this job
  # uses the system Python and xvfb.
  gui:
    name: dashboard (system Python + xvfb)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK bindings and xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-gi python3-gi-cairo gir1.2-gtk-3.0 \
            gir1.2-ayatanaappindicator3-0.1 python3-pytest xvfb
      - name: Show what this runner supports
        run: python3 fg_platform.py || true
      - name: Run the suite under xvfb
        run: xvfb-run -a python3 -m pytest tests -q

  shell:
    name: shell scripts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: |
          for script in freeze-guard fg-daemon.sh install.sh scripts/run-tests.sh; do
            bash -n "$script"
          done
      - name: shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck -S warning freeze-guard fg-daemon.sh install.sh \
            scripts/run-tests.sh || true
